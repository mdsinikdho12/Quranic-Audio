<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quranic Audio - Abdul Basit Mujawwad</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary: #0f3a2f;
        --secondary: #1a5c45;
        --accent: #d4af37;
        --light-bg: #f5f3f0;
        --text-dark: #1a1a1a;
        --text-light: #ffffff;
        --border: #e0dbd0;
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.12);
        --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.15);
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen",
          sans-serif;
        background: var(--light-bg);
        color: var(--text-dark);
        min-height: 100vh;
        line-height: 1.6;
      }

      /* Header Section */
      header {
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--secondary) 100%
        );
        color: var(--text-light);
        padding: 100px 40px;
        text-align: center;
        position: relative;
        overflow: hidden;
        clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);
      }

      header::before {
        content: "";
        position: absolute;
        top: -50%;
        right: -5%;
        width: 500px;
        height: 500px;
        background: radial-gradient(
          circle,
          rgba(212, 175, 55, 0.15) 0%,
          transparent 70%
        );
        border-radius: 50%;
        animation: float 6s ease-in-out infinite;
      }

      header::after {
        content: "";
        position: absolute;
        bottom: -50%;
        left: -10%;
        width: 400px;
        height: 400px;
        background: radial-gradient(
          circle,
          rgba(212, 175, 55, 0.1) 0%,
          transparent 70%
        );
        border-radius: 50%;
        animation: float 8s ease-in-out infinite reverse;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-30px);
        }
      }

      header h1 {
        font-size: 3.5rem;
        font-weight: 700;
        letter-spacing: -1px;
        margin-bottom: 15px;
        position: relative;
        z-index: 1;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
      }

      header p {
        font-size: 1.25rem;
        font-weight: 400;
        opacity: 0.95;
        position: relative;
        z-index: 1;
      }

      .subtitle {
        font-size: 0.9rem;
        opacity: 0.85;
        margin-top: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-weight: 500;
      }

      /* Main Container */
      .container {
        max-width: 1400px;
        margin: -40px auto 0;
        padding: 60px 40px;
        position: relative;
        z-index: 10;
      }

      /* Search Bar */
      .search-section {
        margin-bottom: 60px;
        text-align: center;
      }

      .search-bar {
        display: flex;
        gap: 12px;
        max-width: 650px;
        margin: 0 auto;
        box-shadow: var(--shadow-lg);
        border-radius: 12px;
        background: white;
        padding: 8px;
      }

      .search-bar input {
        flex: 1;
        padding: 14px 24px;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-family: inherit;
        transition: all 0.3s ease;
        background: transparent;
      }

      .search-bar input:focus {
        outline: none;
        background: rgba(212, 175, 55, 0.05);
      }

      .search-bar input::placeholder {
        color: #999;
      }

      .search-bar button {
        padding: 14px 32px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.95rem;
        font-weight: 600;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }

      .search-bar button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(15, 58, 47, 0.3);
      }

      .search-bar button:active {
        transform: translateY(0);
      }

      /* Chapters Grid */
      .chapters-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 28px;
        margin-bottom: 40px;
      }

      .chapter-card {
        background: white;
        border-radius: 12px;
        padding: 32px;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-sm);
        position: relative;
        overflow: hidden;
      }

      .chapter-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: linear-gradient(90deg, var(--accent), var(--primary));
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.4s ease;
      }

      .chapter-card:hover {
        transform: translateY(-12px);
        border-color: var(--accent);
        box-shadow: var(--shadow-lg);
      }

      .chapter-card:hover::before {
        transform: scaleX(1);
      }

      .chapter-number {
        font-size: 0.8rem;
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 12px;
      }

      .chapter-title {
        font-size: 1.75rem;
        font-weight: 600;
        color: var(--text-dark);
        margin-bottom: 8px;
      }

      .chapter-title-ar {
        font-size: 1.5rem;
        color: var(--primary);
        margin-bottom: 16px;
        direction: rtl;
        text-align: right;
        font-weight: 500;
      }

      .chapter-details {
        font-size: 0.9rem;
        color: #666;
        margin-bottom: 20px;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }

      .chapter-details span {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .play-button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 13px 24px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 0.95rem;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      .play-button:hover {
        transform: scale(1.04);
        box-shadow: 0 8px 20px rgba(15, 58, 47, 0.3);
      }

      .play-button:active {
        transform: scale(0.98);
      }

      /* Player Modal */
      .player-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        backdrop-filter: blur(5px);
      }

      .player-modal.active {
        display: flex;
        animation: fadeIn 0.3s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .player-content {
        background: white;
        border-radius: 16px;
        padding: 48px;
        max-width: 550px;
        width: 90%;
        box-shadow: var(--shadow-lg);
        animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative;
        border: 1px solid var(--border);
      }

      @keyframes slideUp {
        from {
          transform: translateY(50px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .close-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        background: var(--light-bg);
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        font-size: 24px;
        cursor: pointer;
        color: var(--text-dark);
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .close-btn:hover {
        background: var(--accent);
        color: white;
        transform: rotate(90deg);
      }

      .player-header {
        margin-bottom: 32px;
      }

      .player-header h2 {
        font-size: 1.8rem;
        margin-bottom: 8px;
        color: var(--text-dark);
      }

      .player-header p {
        color: #666;
        font-size: 0.95rem;
      }

      .audio-player {
        width: 100%;
        margin-bottom: 32px;
        height: 42px;
        border-radius: 8px;
      }

      .player-info {
        background: linear-gradient(
          135deg,
          rgba(15, 58, 47, 0.05),
          rgba(212, 175, 55, 0.05)
        );
        padding: 24px;
        border-radius: 12px;
        border: 1px solid var(--border);
        font-size: 0.9rem;
        line-height: 1.9;
      }

      .player-info p {
        margin: 8px 0;
      }

      .player-info strong {
        color: var(--primary);
        font-weight: 600;
      }

      /* Footer */
      footer {
        background: var(--primary);
        color: var(--text-light);
        text-align: center;
        padding: 50px 40px;
        margin-top: 80px;
        font-size: 0.9rem;
      }

      footer p {
        margin: 10px 0;
      }

      .footer-link {
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s ease;
      }

      .footer-link:hover {
        text-decoration: underline;
        opacity: 0.8;
      }

      /* Loading State */
      .loading {
        text-align: center;
        padding: 60px 40px;
        color: #999;
      }

      .spinner {
        display: inline-block;
        width: 50px;
        height: 50px;
        border: 4px solid #ddd;
        border-top: 4px solid var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Error State */
      .error-message {
        background: #fff5f5;
        color: #c53030;
        padding: 20px 24px;
        border-radius: 12px;
        margin-bottom: 24px;
        border-left: 4px solid #c53030;
        box-shadow: var(--shadow-sm);
      }

      /* Responsive */
      @media (max-width: 768px) {
        header {
          padding: 60px 20px;
          clip-path: polygon(0 0, 100% 0, 100% 80%, 0 100%);
        }

        header h1 {
          font-size: 2rem;
        }

        .container {
          padding: 40px 20px;
          margin-top: -30px;
        }

        .chapters-grid {
          grid-template-columns: 1fr;
          gap: 20px;
        }

        .player-content {
          padding: 32px 24px;
          max-width: 90%;
        }

        .search-bar {
          flex-direction: column;
        }

        .search-bar button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Quranic Audio</h1>
      <p>Abdul Basit Al-Mujawwad</p>
      <p class="subtitle">Complete Quran Recitation Collection</p>
    </header>

    <div class="container">
      <div class="search-section">
        <div class="search-bar">
          <input
            type="text"
            id="searchInput"
            placeholder="Search by chapter name or number..." />
          <button onclick="filterChapters()">Search</button>
        </div>
      </div>

      <div id="errorContainer"></div>
      <div id="loadingContainer" class="loading">
        <div class="spinner"></div>
        <p>Loading chapters...</p>
      </div>
      <div id="chaptersContainer" class="chapters-grid"></div>
    </div>

    <div id="playerModal" class="player-modal">
      <div class="player-content">
        <button class="close-btn" onclick="closePlayer()">✕</button>
        <div class="player-header">
          <h2 id="playerTitle">Chapter Title</h2>
          <p id="playerSubtitle"></p>
        </div>
        <audio id="audioPlayer" class="audio-player" controls>
          Your browser does not support the audio element.
        </audio>
        <div class="player-info">
          <p><strong>Reciter:</strong> Abdul Basit Al-Mujawwad</p>
          <p><strong>Format:</strong> <span id="playerFormat">MP3</span></p>
          <p><strong>Style:</strong> Mujawwad (with embellishments)</p>
        </div>
      </div>
    </div>

    <footer>
      <p>&copy; 2025 Quranic Audio Platform</p>
      <p>
        Audio from
        <a href="https://quranicaudio.com/" class="footer-link"
          >Quranic Audio</a
        >
        • Chapters from
        <a href="https://quran.com/" class="footer-link">Quran.com API</a>
      </p>
    </footer>

    <script>
      const audioData = {

        10735: 2,

        10830: 109,
        10831: 110,
        10832: 111,
        10833: 112,
        11109: 113,
        10834: 114,
      };

      let chapters = [];

      async function loadChapters() {
        try {
          const response = await fetch("https://api.quran.com/api/v4/chapters");
          const data = await response.json();
          chapters = data.chapters;
          renderChapters(chapters);
          document.getElementById("loadingContainer").style.display = "none";
        } catch (error) {
          showError("Failed to load chapters. Please refresh the page.");
          document.getElementById("loadingContainer").style.display = "none";
        }
      }

      function renderChapters(chaptersToRender) {
        const container = document.getElementById("chaptersContainer");
        container.innerHTML = "";

        if (chaptersToRender.length === 0) {
          container.innerHTML =
            '<p style="grid-column: 1/-1; text-align: center; padding: 40px; color: #999;">No chapters found</p>';
          return;
        }

        chaptersToRender.forEach((chapter) => {
          const audioUrl = `https://download.quranicaudio.com/qdc/abdul_baset/mujawwad/${chapter.id}.mp3`;
          const card = document.createElement("div");
          card.className = "chapter-card";
          card.innerHTML = `
                    <div class="chapter-number">Chapter ${chapter.id}</div>
                    <h3 class="chapter-title">${chapter.name_simple}</h3>
                    <h3 class="chapter-title-ar">${chapter.name_arabic}</h3>
                    <div class="chapter-details">
                        <span>📍 ${chapter.revelation_place}</span>
                        <span>📖 ${chapter.verses_count} verses</span>
                    </div>
                    <button class="play-button" onclick="playChapter(${chapter.id}, '${chapter.name_simple.replace(/'/g, "\\'")}', '${audioUrl.replace(/'/g, "\\'")}')">
                        ▶ Play Audio
                    </button>
                `;
          container.appendChild(card);
        });
      }

      function filterChapters() {
        const searchTerm = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const filtered = chapters.filter(
          (chapter) =>
            chapter.name_simple.toLowerCase().includes(searchTerm) ||
            chapter.id.toString().includes(searchTerm) ||
            chapter.name_arabic.includes(searchTerm),
        );
        renderChapters(filtered);
      }

      function playChapter(id, title, audioUrl) {
        const player = document.getElementById("audioPlayer");
        const modal = document.getElementById("playerModal");

        document.getElementById("playerTitle").textContent = title;
        document.getElementById("playerSubtitle").textContent =
          `Chapter ${id} • Surah`;

        player.src = audioUrl;
        player.play();

        modal.classList.add("active");
      }

      function closePlayer() {
        const player = document.getElementById("audioPlayer");
        const modal = document.getElementById("playerModal");

        player.pause();
        player.currentTime = 0;
        modal.classList.remove("active");
      }

      function showError(message) {
        const errorContainer = document.getElementById("errorContainer");
        errorContainer.innerHTML = `<div class="error-message">${message}</div>`;
      }

      document.getElementById("playerModal").addEventListener("click", (e) => {
        if (e.target.id === "playerModal") closePlayer();
      });

      document
        .getElementById("searchInput")
        .addEventListener("keypress", (e) => {
          if (e.key === "Enter") filterChapters();
        });

      window.addEventListener("load", loadChapters);
    </script>
  </body>
</html>
